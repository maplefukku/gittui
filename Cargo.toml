[package]
name = "gittui"
version = "0.1.0"
edition = "2021"
description = "A VS Code-like Git TUI tool built in Rust"
license = "MIT"
repository = "https://github.com/maplefukku/gittui"
homepage = "https://github.com/maplefukku/gittui"
readme = "README.md"
keywords = ["git", "tui", "terminal", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
ratatui = { version = "0.28", features = ["all-widgets"] }
crossterm = { version = "0.28", features = ["event-stream"] }
git2 = { version = "0.19", features = ["vendored-openssl"] }
tokio = { version = "1", features = ["full"] }
syntect = "5"
unicode-width = "0.2"
dirs = "5"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
fuzzy-matcher = "0.3"
notify = "6"
textwrap = "0.16"

[profile.release]
opt-level = 3
lto = true
strip = true
